# One-command internet hosting: app + PostgreSQL sidecar.
#   docker compose up -d --build
# then open http://YOUR_HOST:8080/ — friends play online via the room codes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stickman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stickman"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: stickman
      PORT: "8080"
      SECRET: "${SECRET:-change_this_secret}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: