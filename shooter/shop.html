<!doctype html><script src="page-audio.js" defer></script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickman Shooter Shop</title>
<style>
:root{background:#050914;color:#edf4ff;font-family:Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17335a,#050914 62%);padding:32px 16px}.wrap{width:min(620px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;color:#64ddff}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.back{background:#263754;color:#fff}.card{background:#0b1527dd;border:1px solid #365681;border-radius:14px;padding:18px;margin:12px 0}.wallet{color:#8de8ff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.skin{border:1px solid #304b70;border-radius:10px;padding:14px}.skin h3{margin:0 0 8px}.skin button{margin-top:12px;background:#168dc2;color:#fff}.skin button.equipped{background:#20aa72}.pack{background:#122848;color:#fff;border:1px solid #416b9c;width:100%}.muted{color:#9cb0cc;font-size:13px}.status{min-height:22px;color:#ffb5b5;margin-top:12px}
</style></head><body><main class="wrap"><div class="top"><h1>Shop</h1><div><button class="back" id="mute">Mute</button> <button class="back" onclick="location.href='settings.html'">Sound</button> <button class="back" onclick="location.href='index.html'">Back Home</button></div></div><section class="card"><div class="wallet">Diamonds: <span id="diamonds">...</span></div><p class="muted">Buy a skin, then equip it for your next battle.</p><div id="skins" class="grid"></div><div id="status" class="status"></div></section><section class="card"><h2>Diamond Packs</h2><div id="packs" class="grid"></div></section></main><script>
const token=localStorage.getItem('token'), api=(p,o={})=>{o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};return fetch('/api'+p,o).then(async r=>({ok:r.ok,body:await r.json()}))};
const soundDefaults={muted:false,master:.7,music:.16,sfx:.3,track:0};let soundSettings=soundDefaults;try{soundSettings={...soundDefaults,...JSON.parse(localStorage.getItem('sound-settings')||'{}')}}catch(_){localStorage.removeItem('sound-settings')}const mute=document.getElementById('mute');function updateMute(){mute.textContent=soundSettings.muted?'Unmute':'Mute'}mute.onclick=()=>{soundSettings.muted=!soundSettings.muted;localStorage.setItem('sound-settings',JSON.stringify(soundSettings));updateMute()};updateMute();
const status=document.getElementById('status');function fail(x){status.textContent=x}
async function load(){if(!token){location.href='index.html';return}const me=await api('/me');if(!me.ok){localStorage.removeItem('token');location.href='index.html';return}document.getElementById('diamonds').textContent=me.body.diamonds;const skins=await (await fetch('/api/skins')).json();document.getElementById('skins').innerHTML=skins.map(s=>{const owned=me.body.unlocked.includes(s.id),eq=me.body.selectedSkin===s.id;return `<article class="skin"><h3>${s.name}</h3><div class="muted">${eq?'Equipped':owned?'Owned':s.price+' diamonds'}</div><button class="${eq?'equipped':''}" data-id="${s.id}" ${owned?'':'data-buy="1"'}>${eq?'Equipped':owned?'Equip':'Buy'}</button></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>act(b,me.body));const packs=await (await fetch('/api/demo-packs')).json();const admin=me.body.username.toLowerCase()==='thant';document.getElementById('packs').innerHTML=packs.map(p=>`<button class="pack" data-pack="${p.id}" ${admin?'':'disabled'}>${p.label} - +${p.diamonds} diamonds${admin?'':' (Admin only)'}</button>`).join('');if(admin)document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=async()=>{const r=await api('/buy-diamonds',{method:'POST',body:JSON.stringify({packId:b.dataset.pack})});if(r.ok)load();else fail(r.body.error||'Purchase failed')})}
async function act(button,user){const id=button.dataset.id;const path=button.dataset.buy?'/purchase':'/select-skin';const r=await api(path,{method:'POST',body:JSON.stringify({skinId:id})});if(!r.ok){fail(r.body.error||'Action failed');return}load()}load();
</script></body></html>
