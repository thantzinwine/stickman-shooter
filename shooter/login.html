<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stickman Shooter Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#17335a,#050914 65%);color:#edf4ff;font:15px Segoe UI,sans-serif}.card{width:min(420px,calc(100% - 32px));background:#0b1527ee;border:1px solid #365681;border-radius:16px;padding:24px;box-shadow:0 18px 50px #0008}h1{margin:0 0 6px;text-align:center;color:#64ddff}p{color:#9cb0cc;text-align:center}label{display:grid;gap:6px;margin:14px 0}input{padding:12px;border-radius:8px;border:1px solid #5274a4;background:#071020;color:#fff;font-size:15px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#168dc2;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#263754}.status{min-height:22px;color:#ffb5b5;text-align:center;margin-top:12px}</style></head><body><main class="card"><h1>Stickman Shooter</h1><p>Sign in to enter the game</p><form id="form"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Login</button><button type="button" class="secondary" id="signup">Create account</button><div class="status" id="status"></div></form></main><script>
const status=document.getElementById('status');async function submit(path){status.textContent='Please wait...';const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;if(!username||!password){status.textContent='Enter username and password';return}try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const data=await r.json();if(!r.ok){status.textContent=data.error||'Authentication failed';return}localStorage.setItem('token',data.token);location.href='index.html?v=login'}catch(_){status.textContent='Server unavailable. Open http://localhost:3000/'} }document.getElementById('form').onsubmit=e=>{e.preventDefault();submit('login')};document.getElementById('signup').onclick=()=>submit('signup');
</script></body></html>
