<!doctype html><script src="page-audio.js" defer></script>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stickman Shooter Friends</title>
<style>
:root{background:#050914;color:#edf4ff;font-family:Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17335a,#050914 62%);padding:32px 16px}.wrap{width:min(620px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;color:#64ddff}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.back{background:#263754;color:#fff}.card{background:#0b1527dd;border:1px solid #365681;border-radius:14px;padding:18px;margin:12px 0}.muted{color:#9cb0cc;font-size:13px}.status{min-height:22px;color:#ffb5b5;margin-top:12px}.add{display:flex;gap:10px;margin-top:12px}.add input{flex:1;background:#122848;color:#fff;border:1px solid #416b9c;border-radius:9px;padding:11px 12px;font-size:14px}.add button{background:#168dc2;color:#fff;white-space:nowrap}.list{display:grid;gap:10px;margin-top:14px}.friend{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #304b70;border-radius:10px;padding:12px 14px}.fleft{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,#2fd5ff,#1b7fff);color:#05111d;flex-shrink:0}.fmeta{color:#9cb0cc;font-size:12px;margin-top:2px}.fname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rm{background:rgba(255,90,90,.16);color:#ffb4b4;border:1px solid rgba(255,120,120,.3);padding:8px 12px;font-size:13px}.empty{color:#9cb0cc;text-align:center;padding:22px 0}.ok{color:#8de8ff}
</style></head><body><main class="wrap"><div class="top"><h1>Friends</h1><div><button class="back" id="mute">Mute</button> <button class="back" onclick="location.href='settings.html'">Sound</button> <button class="back" onclick="location.href='index.html'">Back Home</button></div></div><section class="card"><p class="muted">Add a friend by username to build your squad, then remove them anytime.</p><div class="add"><input id="add-input" placeholder="Add friend by username..." /><button id="add-btn">Add</button></div><div id="status" class="status"></div><div id="list" class="list"></div></section></main><script>
const token=localStorage.getItem('token'), api=(p,o={})=>{o.headers={...(o.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token};return fetch('/api'+p,o).then(async r=>{const t=await r.text();let b={};try{b=t?JSON.parse(t):{}}catch(_){b={error:t}}return{ok:r.ok,body:b}})};
const soundDefaults={muted:false,master:.7,music:.16,sfx:.3,track:0};let soundSettings=soundDefaults;try{soundSettings={...soundDefaults,...JSON.parse(localStorage.getItem('sound-settings')||'{}')}}catch(_){localStorage.removeItem('sound-settings')}const mute=document.getElementById('mute');function updateMute(){mute.textContent=soundSettings.muted?'Unmute':'Mute'}mute.onclick=()=>{soundSettings.muted=!soundSettings.muted;localStorage.setItem('sound-settings',JSON.stringify(soundSettings));updateMute()};updateMute();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const listEl=document.getElementById('list'),statusEl=document.getElementById('status');function say(x,ok){statusEl.textContent=x||'';statusEl.style.color=ok?'#8de8ff':'#ffb5b5'}
async function load(){if(!token){location.href='index.html';return}const r=await api('/friends');if(!r.ok){say(r.body.error||'Could not load friends');return}const f=r.body.friends||[];listEl.innerHTML=f.length?f.map(x=>`<div class="friend"><div class="fleft"><div class="avatar">🕹️</div><div style="min-width:0"><div class="fname">${esc(x.username||'Unknown')}</div><div class="fmeta">#${x.id}</div></div></div><button class="back rm" data-id="${x.id}">Remove</button></div>`).join(''):`<div class="empty">No friends yet. Add a friend to get started.</div>`;listEl.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{const rm=await api('/friends/remove',{method:'POST',body:JSON.stringify({targetUserId:b.dataset.id})});say(rm.ok?'Friend removed.':(rm.body.error||'Remove failed'));load()})}
document.getElementById('add-btn').onclick=async()=>{const username=document.getElementById('add-input').value.trim();if(!username){say('Enter a username to add.');return}const r=await api('/friends/add',{method:'POST',body:JSON.stringify({username})});if(r.ok){document.getElementById('add-input').value='';say(`Added ${r.body.friend.username}.`,true)}else say(r.body.error||'Add failed');load()};load();
</script></body></html>
