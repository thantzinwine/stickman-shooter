<!doctype html><script src="page-audio.js" defer></script>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Settings</title><style>:root{background:#050914;color:#edf4ff;font-family:Segoe UI,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17335a,#050914 62%);padding:32px 16px}.wrap{width:min(520px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{color:#64ddff}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.back{background:#263754;color:#fff}.card{background:#0b1527dd;border:1px solid #365681;border-radius:14px;padding:20px}.row{display:grid;grid-template-columns:130px 1fr 50px;gap:12px;align-items:center;margin:22px 0}.row input[type=range]{width:100%;accent-color:#2fd5ff}.row output{color:#8de8ff;text-align:right}select{background:#122848;color:#fff;border:1px solid #416b9c;border-radius:7px;padding:9px}</style></head><body><main class="wrap"><div class="top"><h1>Sound Settings</h1><button class="back" onclick="location.href='index.html'">Back Home</button></div><section class="card"><label class="row"><span>Mute all</span><input id="muted" type="checkbox"><output></output></label><label class="row"><span>Master</span><input id="master" type="range" min="0" max="1" step=".01"><output></output></label><label class="row"><span>Music</span><input id="music" type="range" min="0" max="1" step=".01"><output></output></label><label class="row"><span>SFX</span><input id="sfx" type="range" min="0" max="1" step=".01"><output></output></label><label class="row"><span>Music theme</span><select id="track"><option value="0">Theme 1</option><option value="1">Theme 2</option><option value="2">Theme 3</option></select><output></output></label></section></main><script>
const defaults={muted:false,master:.7,music:.16,sfx:.3,track:0};let settings=defaults;try{settings={...defaults,...JSON.parse(localStorage.getItem('sound-settings')||'{}')}}catch(_){localStorage.removeItem('sound-settings')}function save(){localStorage.setItem('sound-settings',JSON.stringify(settings));render()}function render(){for(const id of ['master','music','sfx']){const e=document.getElementById(id);e.value=settings[id];e.parentElement.querySelector('output').textContent=Math.round(settings[id]*100)+'%'}document.getElementById('muted').checked=settings.muted;document.getElementById('track').value=settings.track}for(const id of ['master','music','sfx'])document.getElementById(id).oninput=e=>{settings[id]=+e.target.value;save()};document.getElementById('muted').onchange=e=>{settings.muted=e.target.checked;save()};document.getElementById('track').onchange=e=>{settings.track=+e.target.value;save()};render();
</script></body></html>
